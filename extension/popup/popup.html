<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Summarizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" data-state="idle">

    <!-- ── Header ── -->
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 2.5h7M1.5 5h5M1.5 7.5h6" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">Page Summarizer</span>
      </div>
      <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- ── Body ── -->
    <div class="body">

      <!-- Page info (shown in idle, extracting, summarizing, ready, cached, error) -->
      <div class="page-info" id="page-info">
        <p class="page-title" id="page-title">Loading…</p>
        <p class="page-url" id="page-url"></p>
      </div>

      <!-- Summarize / Re-summarize button (idle, ready, cached) -->
      <div class="btn-row" id="btn-row">
        <button class="btn-primary" id="summarize-btn" disabled>
          <span class="btn-spinner" aria-hidden="true"></span>
          <svg class="btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span class="btn-label">Summarize Page</span>
        </button>
      </div>

      <!-- Extracting indicator (state: extracting) -->
      <div class="extracting-row" id="extracting-row" aria-live="polite">
        <span class="extracting-spinner" aria-hidden="true"></span>
        <span class="extracting-label">Reading page…</span>
      </div>

      <!-- Summarizing (state: summarizing) -->
      <div class="summarizing-area" id="summarizing-area">
        <div class="progress-track" role="progressbar" aria-label="Summarizing">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="summarizing-label">Summarizing…</p>
        <div class="skeleton-lines">
          <div class="skeleton-line" style="width:80%"></div>
          <div class="skeleton-line" style="width:70%"></div>
          <div class="skeleton-line" style="width:55%"></div>
        </div>
      </div>

      <!-- Summary area (state: ready, cached) -->
      <div class="summary-area" id="summary-area">
        <!-- Meta chips -->
        <div class="meta-row" id="meta-row">
          <span class="chip" id="chip-time">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="meta-time">— min read</span>
          </span>
          <span class="chip" id="chip-words">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
            <span id="meta-words">— words</span>
          </span>
          <span class="chip chip-cached" id="chip-cached">
            <span class="cached-dot" aria-hidden="true">●</span>
            Cached
          </span>
        </div>

        <!-- Summary bullets -->
        <div class="section">
          <p class="section-label">SUMMARY</p>
          <div class="bullets-block" id="bullets-block">
            <ul class="bullets-list" id="bullets-list"></ul>
          </div>
        </div>

        <!-- Key insights -->
        <div class="section">
          <p class="section-label">KEY INSIGHTS</p>
          <div class="insights-list" id="insights-list"></div>
        </div>
      </div>

      <!-- Error banner (state: error) -->
      <div class="banner banner-error" id="error-banner" role="alert">
        <div class="banner-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="error-message">Something went wrong.</span>
        </div>
        <button class="btn-ghost" id="retry-btn">Try again</button>
      </div>

      <!-- Restricted / no-content banner (state: restricted) -->
      <div class="banner banner-warn" id="restricted-banner" role="alert">
        <div class="banner-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="restricted-message">Not enough content to summarize.</span>
        </div>
        <p class="banner-sub">Try on an article or blog post.</p>
      </div>

    </div><!-- /.body -->

    <!-- ── Footer (ready, cached) ── -->
    <footer class="footer" id="footer">
      <button class="btn-ghost" id="clear-btn">Clear</button>
      <button class="btn-ghost" id="copy-btn">
        <svg class="copy-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="copy-check hidden" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Copy
      </button>
    </footer>

    <!-- ── Settings panel ── -->
    <div id="settings-panel" class="settings-panel" aria-hidden="true">
      <div class="settings-header">
        <h2 class="settings-title">Settings</h2>
        <button class="icon-btn" id="close-settings-btn" aria-label="Close settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="settings-body">

        <div class="field">
          <label class="field-label">Bullet count</label>
          <div class="segmented" role="group" aria-label="Bullet count">
            <label class="seg-option">
              <input type="radio" name="bulletCount" value="3" checked />
              <span>3</span>
            </label>
            <label class="seg-option">
              <input type="radio" name="bulletCount" value="5" />
              <span>5</span>
            </label>
            <label class="seg-option">
              <input type="radio" name="bulletCount" value="7" />
              <span>7</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="language-select">Summary language</label>
          <div class="select-wrap">
            <select class="select-input" id="language-select">
              <option value="English">English</option>
              <option value="Spanish">Spanish</option>
              <option value="French">French</option>
              <option value="German">German</option>
              <option value="Portuguese">Portuguese</option>
              <option value="Arabic">Arabic</option>
              <option value="Chinese">Chinese (Simplified)</option>
              <option value="Japanese">Japanese</option>
              <option value="Korean">Korean</option>
              <option value="Hindi">Hindi</option>
            </select>
            <svg class="select-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Cache duration</label>
          <div class="segmented" role="group" aria-label="Cache duration">
            <label class="seg-option">
              <input type="radio" name="cacheTTL" value="0" />
              <span>Off</span>
            </label>
            <label class="seg-option">
              <input type="radio" name="cacheTTL" value="1" />
              <span>1h</span>
            </label>
            <label class="seg-option">
              <input type="radio" name="cacheTTL" value="24" checked />
              <span>24h</span>
            </label>
            <label class="seg-option">
              <input type="radio" name="cacheTTL" value="168" />
              <span>7d</span>
            </label>
          </div>
          <p class="field-hint">How long to keep summaries before re-fetching.</p>
        </div>

      </div>

      <div class="settings-footer">
        <button class="btn-primary btn-save" id="save-settings-btn">
          <svg class="save-check hidden" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span class="save-label">Save</span>
        </button>
      </div>
    </div>

  </div><!-- /#app -->

  <script src="popup.js"></script>
</body>
</html>
